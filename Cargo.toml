[workspace]
resolver = "2"
members = [
    "crates/sc-curve25519",
    "crates/sc-ed25519",
    "crates/sc-xed25519",
    "crates/sc-hkdf",
    "crates/sc-pbkdf2",
    "crates/sc-argon2",
    "crates/sc-aes",
    "crates/sc-hmac",
    "crates/sc-sha256",
    "crates/sc-chacha20poly1305",
    "crates/sc-utils",
    "crates/sc-encoding",
    "crates/sc-node",
    "crates/sc-benches",
]
# The fuzz crate is a separate workspace (needs nightly + libfuzzer); keep it out
# of the main workspace build/test.
exclude = ["fuzz"]

[workspace.package]
version = "0.4.8"
edition = "2021"
rust-version = "1.80"
authors = ["Brashkie (Hepein)"]
license = "Apache-2.0"
repository = "https://github.com/Brashkie/signalis-core"
homepage = "https://github.com/Brashkie/signalis-core"
keywords = ["cryptography", "signal-protocol", "e2e-encryption", "curve25519", "rust"]
categories = ["cryptography"]

[workspace.dependencies]
# Crypto primitives (audited)
curve25519-dalek = { version = "4.1", default-features = false, features = ["zeroize", "rand_core"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
cipher = "0.4"

# v0.3.0
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc", "rand_core"] }

# NEW v0.4.0 — Encoding
base64 = "0.22"
hex = "0.4"

# Util
zeroize = { version = "1.7", features = ["zeroize_derive"] }
subtle = "2.5"
rand = "0.8"

# Benchmarking (dev-only, used by crates/sc-benches)
criterion = { version = "0.5", features = ["html_reports"] }
rand_core = { version = "0.6", features = ["std"] }
thiserror = "1.0"

# Internal crates
sc-curve25519 = { version = "0.4.0", path = "crates/sc-curve25519" }
sc-ed25519 = { version = "0.4.0", path = "crates/sc-ed25519" }
sc-xed25519 = { version = "0.4.0", path = "crates/sc-xed25519" }
sc-hkdf = { version = "0.4.0", path = "crates/sc-hkdf" }
sc-pbkdf2 = { version = "0.4.0", path = "crates/sc-pbkdf2" }
sc-argon2 = { version = "0.4.0", path = "crates/sc-argon2" }
sc-aes = { version = "0.4.0", path = "crates/sc-aes" }
sc-hmac = { version = "0.4.0", path = "crates/sc-hmac" }
sc-sha256 = { version = "0.4.0", path = "crates/sc-sha256" }
sc-chacha20poly1305 = { version = "0.4.0", path = "crates/sc-chacha20poly1305" }
sc-utils = { version = "0.4.0", path = "crates/sc-utils" }
sc-encoding = { version = "0.4.0", path = "crates/sc-encoding" }

# Tests
hex-literal = "0.4"
proptest = "1"

# NAPI - Pinned to versions compatible with Rust 1.80+
napi = { version = "2.16", default-features = false, features = ["napi9"] }
napi-derive = "2.16"
napi-build = "=2.1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
